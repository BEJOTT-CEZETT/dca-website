<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt | DCA Architekten</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .projekt-wrap {
            padding-top: 12rem;
            padding-bottom: 10rem;
            text-align: center;
        }
        .slideshow {
            position: relative;
            width: 75%;
            margin: 3rem auto 3rem;
            user-select: none;
        }
        /* Bild als CSS-Background — gleiche Darstellung wie zuvor mit <img> */
        .slide-bg {
            width: 100%;
            height: 75vh;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #fff;
            transition: opacity 0.6s ease-in-out;
            position: relative;
        }
        /* Unsichtbares Overlay — blockiert Rechtsklick und Drag */
        .slide-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            cursor: default;
        }
        /* Pfeil Buttons */
        .slide-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 2.4rem;
            line-height: 1;
            cursor: pointer;
            color: rgba(0,0,0,0.45);
            z-index: 10;
            padding: 0.5rem 1rem;
            transition: color 0.2s;
        }
        .slide-btn:hover { color: rgba(0,0,0,0.9); }
        .slide-btn.prev { left: 0.5rem; }
        .slide-btn.next { right: 0.5rem; }
        /* Klickbereiche */
        .slide-left, .slide-right {
            position: absolute;
            top: 0; bottom: 0;
            width: 50%;
            z-index: 5;
            cursor: pointer;
        }
        .slide-left { left: 0; }
        .slide-right { right: 0; }
        /* Punkte */
        .slide-dots {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            max-width: 75%;
            margin-left: auto;
            margin-right: auto;
        }
        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(0,0,0,0.2);
            transition: background 0.3s;
        }
        .dot.aktiv { background: rgba(0,0,0,0.8); }
        .slide-counter {
            font-size: 1.4rem;
            color: rgba(0,0,0,0.35);
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }
        .project-info {
            max-width: 60rem;
            margin: 0 auto;
            text-align: center;
        }
        .project-info h2 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
            color: #000;
        }
        .project-info .project-subtitle {
            font-size: 1.8rem;
            font-weight: 400;
            color: #000;
            margin-bottom: 2.5rem;
        }
        .project-info small {
            display: block;
            font-size: 1.6rem;
            line-height: 1.6;
            color: #000;
            margin-bottom: 0.3rem;
        }
        .project-info .block { margin-top: 2rem; }
        @media (max-width: 750px) {
            .slideshow { width: 95%; }
            .slide-bg { height: 50vh; }
        }
        @media (max-width: 600px) {
            .projekt-wrap { padding-top: 10rem; padding-bottom: 8rem; }
            .slideshow { width: 100%; }
            .slide-bg { height: 70vw; }
            .project-info h2 { font-size: 1.4rem; }
            .project-info .project-subtitle { font-size: 1.4rem; }
            .project-info small { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <header id="site-header">
        <h1><a href="../../index.html" style="color:inherit;text-decoration:none;">Donnerhack Czempiel Architekten</a></h1>
        <div class="subtitle">Bau– und Raumgestaltung</div>
    </header>

    <main>
        <div class="projekt-wrap">

            <div class="slideshow" id="slideshow">
                <div class="slide-bg" id="slide-bg"></div>
                <div class="slide-left" onclick="prevSlide()"></div>
                <div class="slide-right" onclick="nextSlide()"></div>
                <button class="slide-btn prev" onclick="prevSlide()">&#8249;</button>
                <button class="slide-btn next" onclick="nextSlide()">&#8250;</button>
            </div>

            <div class="slide-counter" id="counter" style="display:none;"></div>
            <div class="slide-dots" id="dots"></div>

            <div class="project-info" id="info"></div>

        </div>
    </main>

    <nav id="bottom-nav">
        <a href="../../projekte.html">Projekte</a>
        <span class="sep">|</span>
        <a href="../../buero.html">Büro</a>
        <span class="sep">|</span>
        <a href="../../werkliste.html">Werkliste</a>
        <span class="sep">|</span>
        <a href="../../kontakt.html">Kontakt</a>
    </nav>

    <script src="../../projekte.js"></script>
    <script>
    // ---- BILDSCHUTZ ----
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('dragstart', function(e) { e.preventDefault(); });
    document.addEventListener('selectstart', function(e) { e.preventDefault(); });

    // ---- SLIDESHOW ----
    const pfad = window.location.pathname.replace(/\\/g, '/');
    const teile = pfad.split('/');
    const ordner = teile[teile.length - 2] || '';
    const projekt = PROJEKTE.find(p => p.ordner === ordner);

    let aktuellesBild = 1;
    let anzahlBilder = 1;
    let autoTimer = null;

    if (projekt) {
        document.title = projekt.titel + ' | DCA Architekten';
        anzahlBilder = projekt.bilder || 1;

        const dotsEl = document.getElementById('dots');
        const dotSize = anzahlBilder > 20 ? '4px' : '6px';
        for (let i = 1; i <= anzahlBilder; i++) {
            const d = document.createElement('div');
            d.className = 'dot';
            d.style.width = dotSize;
            d.style.height = dotSize;
            d.onclick = (function(n) { return function() { zeigeSlide(n); }; })(i);
            dotsEl.appendChild(d);
        }

        let html = '';
        if (projekt.titel) html += `<h2>${projekt.titel}</h2>`;
        if (projekt.untertitel) html += `<div class="project-subtitle">${projekt.untertitel}</div>`;
        if (projekt.auszeichnung) {
            html += `<div class="block"><small><b>Auszeichnung:</b></small><small>${projekt.auszeichnung}</small></div>`;
        }
        html += `<div class="block"><small><b>Projektdaten:</b></small>`;
        if (projekt.auftraggeber) html += `<small>Auftraggeber: ${projekt.auftraggeber}</small>`;
        if (projekt.ort)          html += `<small>Ort: ${projekt.ort}</small>`;
        if (projekt.bgf)          html += `<small>BGF: ${projekt.bgf}</small>`;
        if (projekt.lph)          html += `<small>LPH: ${projekt.lph}</small>`;
        if (projekt.status)       html += `<small>Status: ${projekt.status}</small>`;
        if (projekt.team)         html += `<small>Team: ${projekt.team}</small>`;
        if (projekt.fotos)        html += `<small>Fotos: ${projekt.fotos}</small>`;
        html += `</div>`;
        if (projekt.beschreibung) {
            html += `<div class="block"><small><b>Projektbeschreibung:</b></small><small>${projekt.beschreibung}</small></div>`;
        }
        document.getElementById('info').innerHTML = html;
    }

    function zeigeSlide(n) {
        aktuellesBild = n;
        const bg = document.getElementById('slide-bg');
        bg.style.opacity = '0';
        setTimeout(() => {
            bg.style.backgroundImage = `url('bilder/DCA (${n}).jpg')`;
            bg.style.opacity = '1';
        }, 600);
        document.getElementById('counter').textContent = n + ' / ' + anzahlBilder;
        document.querySelectorAll('.dot').forEach((d, i) => {
            d.classList.toggle('aktiv', i + 1 === n);
        });
        starteAutoplay();
    }

    function nextSlide() {
        zeigeSlide(aktuellesBild < anzahlBilder ? aktuellesBild + 1 : 1);
    }
    function prevSlide() {
        zeigeSlide(aktuellesBild > 1 ? aktuellesBild - 1 : anzahlBilder);
    }

    function starteAutoplay() {
        clearTimeout(autoTimer);
        autoTimer = setTimeout(nextSlide, 6000);
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight') nextSlide();
        if (e.key === 'ArrowLeft') prevSlide();
    });

    zeigeSlide(1);

    const header = document.getElementById('site-header');
    function updateHeader() {
        if (window.scrollY > 50) header.classList.add('scrolled');
        else header.classList.remove('scrolled');
    }
    window.addEventListener('scroll', updateHeader);
    updateHeader();
    </script>

</body>
</html>
