<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCA | Donnerhack Czempiel Architekten</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100%;
        }
        body {
            height: 100%;
        }
        .hero {
            scroll-snap-align: start;
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #e0e0e0;
        }
        .hero-slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }
        .hero-slide.aktiv {
            opacity: 1;
        }
        /* Scroll-Hinweis im Hero */
        .scroll-hint {
            position: absolute;
            bottom: 2.4rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.4s ease;
        }
        .scroll-hint span {
            font-size: 1.1rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
        }
        .scroll-arrow {
            width: 1px;
            height: 3.2rem;
            background: linear-gradient(to bottom, rgba(255,255,255,0.7), transparent);
            animation: pfeil-puls 1.8s ease-in-out infinite;
        }
        @keyframes pfeil-puls {
            0%, 100% { opacity: 0.6; transform: scaleY(1); }
            50% { opacity: 1; transform: scaleY(1.15); }
        }
        .projects-grid {
            scroll-snap-align: start;
            background: #fff;
            position: relative;
            z-index: 1;
            padding-top: 11rem;
            min-height: 100vh;
        }
    </style>
</head>
<body>

    <header id="site-header">
        <h1><a href="index.html" style="color:inherit;text-decoration:none;">Donnerhack Czempiel Architekten</a></h1>
        <div class="subtitle">Bau– und Raumgestaltung aus Köln</div>
    </header>

    <main>
        <!-- Hero Slideshow -->
        <div class="hero" id="hero">
            <div class="scroll-hint" id="scrollHint">
                <span>Scrollen</span>
                <div class="scroll-arrow"></div>
            </div>
        </div>

        <!-- Projekt-Grid -->
        <div class="projects-grid" id="grid"></div>
    </main>

    <nav id="bottom-nav">
        <a href="projekte.html">Projekte</a>
        <span class="sep">|</span>
        <a href="buero.html">Büro</a>
        <span class="sep">|</span>
        <a href="werkliste.html">Werkliste</a>
        <span class="sep">|</span>
        <a href="kontakt.html">Kontakt</a>
    </nav>

    <script src="projekte.js"></script>
    <script>

    // Bei Rückkehr zur Startseite: zu Grid scrollen wenn #grid in URL
    if (window.location.hash === '#grid') {
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('grid').scrollIntoView({ behavior: 'smooth' });
            }, 100);
        });
    }

    // Header
    const header = document.getElementById('site-header');
    function updateHeader() {
        header.classList.toggle('scrolled', window.scrollY > 50);
    }
    window.addEventListener('scroll', updateHeader, { passive: true });
    updateHeader();

    // Scroll-Hint ausblenden
    const scrollHint = document.getElementById('scrollHint');
    window.addEventListener('scroll', () => {
        scrollHint.style.opacity = window.scrollY > 80 ? '0' : '1';
    }, { passive: true });

    // Mausrad: von Hero direkt zum Grid springen
    let scrollSperrt = false;
    window.addEventListener('wheel', function(e) {
        const grid = document.getElementById('grid');
        const heroH = document.getElementById('hero').offsetHeight;
        const scrollPos = window.scrollY;

        // Nach unten: Hero -> Grid
        if (scrollPos < heroH * 0.9 && e.deltaY > 0) {
            e.preventDefault();
            if (scrollSperrt) return;
            scrollSperrt = true;
            window.scrollTo({ top: heroH, behavior: 'smooth' });
            setTimeout(() => { scrollSperrt = false; }, 800);
        }
        // Nach oben: Grid -> Hero
        if (scrollPos >= heroH * 0.9 && scrollPos <= heroH * 1.5 && e.deltaY < 0) {
            e.preventDefault();
            if (scrollSperrt) return;
            scrollSperrt = true;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => { scrollSperrt = false; }, 800);
        }
    }, { passive: false });

    // ---- HERO SLIDESHOW ----
    const hero = document.getElementById('hero');
    const heroDateien = [...HERO_BILDER].sort(() => Math.random() - 0.5);
    const slides = [];

    heroDateien.forEach((dateiname, i) => {
        const img = document.createElement('img');
        img.src = `hero/${dateiname}`;
        img.className = 'hero-slide';
        img.alt = 'DCA Architekten';
        img.onerror = function() { this.remove(); };
        if (i === 0) img.classList.add('aktiv');
        // Vor dem scroll-hint einfügen
        hero.insertBefore(img, hero.querySelector('.scroll-hint'));
        slides.push(img);
    });

    let aktuellerSlide = 0;
    setInterval(() => {
        const alleSlides = hero.querySelectorAll('.hero-slide');
        if (alleSlides.length < 2) return;
        alleSlides[aktuellerSlide].classList.remove('aktiv');
        aktuellerSlide = (aktuellerSlide + 1) % alleSlides.length;
        alleSlides[aktuellerSlide].classList.add('aktiv');
    }, 5000);

    // ---- PROJEKT GRID ----
    const grid = document.getElementById('grid');
    PROJEKTE.forEach(p => {
        const titelbildSrc = `projekte/${p.ordner}/bilder/DCA-Titelbild.jpg`;
        const thumb = document.createElement('a');
        thumb.href = `projekte/${p.ordner}/index.html`;
        thumb.className = 'thumb';
        thumb.innerHTML = `
            <img src="${titelbildSrc}" alt="${p.titel}"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
            <div class="thumb-placeholder" style="display:none; aspect-ratio:4/3;"></div>
            <div class="title">${p.titel}</div>
        `;
        grid.appendChild(thumb);
    });
    </script>

    <script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('dragstart', function(e) { e.preventDefault(); });
    </script>
</body>
</html>
