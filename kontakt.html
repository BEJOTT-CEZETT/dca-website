<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt | DCA Architekten</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .kontakt-karte {
            width: 100%;
            filter: grayscale(100%);
        }
        .kontakt-karte iframe {
            display: block;
            width: 100%;
            height: 50vh;
            border: 0;
        }
        .kontakt-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5rem 3rem 2rem;
        }
        .kontakt-info .name {
            font-size: 2rem;
            font-weight: 700;
            color: #000;
            margin-bottom: 0.2rem;
        }
        .kontakt-info .rechtsform {
            font-size: 1.6rem;
            color: #000;
            margin-bottom: 1.5rem;
        }
        .kontakt-info p {
            font-size: 1.6rem;
            line-height: 1.4;
            color: #000;
        }
        .kontakt-info .qr-code {
            width: 10rem;
            margin: 2.5rem auto 1.5rem;
            cursor: zoom-in;
        }
        .kontakt-info .qr-code img {
            width: 100%;
            display: block;
        }
        /* Lightbox für QR-Code */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.98);
            z-index: 9000;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }
        .lightbox.aktiv { display: flex; }
        .lightbox img {
            max-width: 80vw;
            max-height: 80vh;
            object-fit: contain;
        }
        .kontakt-info a {
            color: #000;
            text-decoration: none;
        }
        .kontakt-links {
            margin-top: 1.5rem;
            font-size: 1.6rem;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
        }
        .kontakt-links a {
            color: #000;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            padding: 0 2rem;
            font-weight: 400;
        }
        .kontakt-links a:hover { opacity: 0.5; }
        .kontakt-links .sep {
            color: rgba(0,0,0,0.3);
            font-size: 1.6rem;
        }
        .kontakt-main {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 13rem;
            padding-bottom: 9rem;
            box-sizing: border-box;
        }

        @media (max-width: 600px) {
            .kontakt-main { padding-top: 11rem; padding-bottom: 9rem; }
            .kontakt-karte iframe { height: 300px; }
            .kontakt-info .name { font-size: 1.4rem; }
            .kontakt-info .rechtsform { font-size: 1.4rem; }
            .kontakt-info p { font-size: 1.4rem; line-height: 1.4; }
            .kontakt-links { font-size: 1.4rem; }
            .kontakt-links a { font-size: 1.4rem; padding: 0 1rem; }
            .kontakt-info .qr-code { width: 8rem; }
        }
    </style>
</head>
<body>

    <header id="site-header">
        <h1><a href="index.html" style="color:inherit;text-decoration:none;">Donnerhack Czempiel Architekten</a></h1>
        <div class="subtitle">Bau– und Raumgestaltung aus Köln</div>
    </header>

    <main class="kontakt-main">
        <!-- Google Maps S/W, Deutsch -->
        <div class="kontakt-karte">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d20000!2d6.9897!3d50.9059!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47bf25a4e4bfffff%3A0x427ef60b8d8b4ca8!2sAm%20Greinshof%206%2C%2050999%20K%C3%B6ln!5e0!3m2!1sde!2sde!4v1700000000000!5m2!1sde!2sde"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>

        <!-- Kontaktdaten -->
        <div class="kontakt-info">
            <div class="name">Donnerhack Czempiel Architekten</div>
            <div class="rechtsform">Partnerschaft mbB</div>
            <p>Am Greinshof 6 | 50999 Köln</p>
            <p id="kontakt-tel"></p>
            <p id="kontakt-mail"></p>

            <div class="qr-code" onclick="document.getElementById('lightbox').classList.add('aktiv')">
                <img src="dca_qr.svg" alt="QR-Code zur Website">
            </div>

            <div class="kontakt-links">
                <a href="impressum.html">Impressum</a>
                <span class="sep">|</span>
                <a href="datenschutz.html">Datenschutz</a>
            </div>
        </div>
    </main>

    <div class="lightbox" id="lightbox" onclick="this.classList.remove('aktiv')">
        <img src="dca_qr.svg" alt="QR-Code zur Website">
    </div>

    <nav id="bottom-nav">
        <a href="index.html?v=2#grid">Projekte</a>
        <span class="sep">|</span>
        <a href="buero.html">Büro</a>
        <span class="sep">|</span>
        <a href="werkliste.html">Werkliste</a>
        <span class="sep">|</span>
        <a href="kontakt.html">Kontakt</a>
    </nav>

    <script>
    const header = document.getElementById('site-header');
    function updateHeader() {
        if (window.scrollY > 50) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
    }
    window.addEventListener('scroll', updateHeader);
    updateHeader();

    // Kontaktdaten zusammensetzen (Spam-/Crawler-Schutz)
    const telTeile = ['+49', ' (0)', '177', ' ', '5608843'];
    document.getElementById('kontakt-tel').textContent = telTeile.join('');

    const mailName = ['i','n','f','o'].join('');
    const mailDomain = ['dca','.','koeln'].join('');
    document.getElementById('kontakt-mail').textContent = mailName + '@' + mailDomain;
    </script>
    <script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('dragstart', function(e) { e.preventDefault(); });
    </script>
</body>
</html>
